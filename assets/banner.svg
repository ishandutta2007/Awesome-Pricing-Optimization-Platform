<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes waveLine {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(1.08) translateY(-4px); }
        100% { transform: scaleY(1); }
      }
      .floating-card-1 { animation: floatSlow 4s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 3s ease-in-out infinite 1s; }
      .floating-card-3 { animation: floatSlow 5s ease-in-out infinite 0.5s; }
      .pulsing-glow { animation: pulseGlow 3s ease-in-out infinite; }
      .chart-wave { animation: waveLine 4s ease-in-out infinite; transform-origin: bottom; }
      .animated-dash { stroke-dasharray: 8 6; animation: dashMove 10s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#38bdf8" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="1050" y1="0" x2="1050" y2="400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1000" cy="280" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="650" cy="200" r="150" fill="#c084fc" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Chart Wave in Background -->
  <g class="chart-wave" opacity="0.7">
    <path d="M 0 350 Q 200 280, 400 310 T 800 220 T 1200 180 L 1200 400 L 0 400 Z" fill="url(#chartGrad)" />
    <path d="M 0 350 Q 200 280, 400 310 T 800 220 T 1200 180" fill="none" stroke="#818cf8" stroke-width="3" filter="url(#softGlow)" />
    <path d="M 0 320 Q 250 360, 500 260 T 950 160 T 1200 130" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-dash" />
  </g>

  <!-- Left Side: Main Typography & Badges -->
  <g transform="translate(80, 65)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED AI &amp; SAAS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Pricing Optimization
    </text>
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">
      Platform Ecosystem <tspan fill="#38bdf8">2026</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Dynamic Pricing • Revenue Management • Price Elasticity • AI Demand Models
    </text>

    <!-- Mini Feature Pills -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="65" y="19" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ SaaS Solutions</text>

      <rect x="142" y="0" width="145" height="30" rx="8" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
      <text x="214" y="19" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 Open-Source ML</text>

      <rect x="299" y="0" width="150" height="30" rx="8" fill="#062e24" stroke="#059669" stroke-width="1" />
      <text x="374" y="19" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Elasticity Engines</text>
    </g>
  </g>

  <!-- Right Side: Dynamic Metric Cards -->
  <!-- Card 1: Revenue Uplift -->
  <g class="floating-card-1" transform="translate(780, 50)">
    <rect width="340" height="85" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="42" cy="42" r="22" fill="#064e3b" />
    <path d="M 32 46 L 40 38 L 46 44 L 52 36" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="78" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">REVENUE OPTIMIZATION</text>
    <text x="78" y="62" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">+18.5% <tspan fill="#10b981" font-size="14" font-weight="600">Margin Gain</tspan></text>
  </g>

  <!-- Card 2: AI Dynamic Repricing -->
  <g class="floating-card-2" transform="translate(740, 155)">
    <rect width="360" height="85" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="42" cy="42" r="22" fill="#0c4a6e" />
    <circle cx="42" cy="42" r="7" fill="#38bdf8" class="pulsing-glow" />
    <text x="78" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AI DYNAMIC REPRICING</text>
    <text x="78" y="62" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">Real-Time Elasticity <tspan fill="#38bdf8" font-size="14">AI</tspan></text>
  </g>

  <!-- Card 3: Market Benchmark -->
  <g class="floating-card-3" transform="translate(800, 260)">
    <rect width="320" height="85" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="42" cy="42" r="22" fill="#312e81" />
    <text x="42" y="48" fill="#a5b4fc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✦</text>
    <text x="78" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ENTERPRISE &amp; OPEN SOURCE</text>
    <text x="78" y="62" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">50+ Repos &amp; Platforms</text>
  </g>

  <!-- Decorative Corner Accent -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>